<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Q3 -->
     <form action="">
        <div>
            <label for="name">Name</label>
            <input type="text" name="" id="name" placeholder="Enter Your Name">
        </div>
         <div>
            <label for="age">Age</label>
            <input type="number" name="" id="age" placeholder="Enter Your Age">
        </div>
         <div>
            <label for="phone">Phone</label>
            <input type="tel" name="" id="phone" placeholder="Enter Your Phone Number">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="" id="email" placeholder="Enter Your Email">
        </div>
         <div>
            <label for="pass">password</label>
            <input type="password" name="" id="pass" placeholder="Enter Your Password">
        </div>
        <div>
            <label for="add">Address</label>
            <textarea name="Address" id="add" rows="3"></textarea>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
     </form>
</body>
</html>
