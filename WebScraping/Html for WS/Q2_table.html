<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML- table</title>
    <style>
table {
  width: 100%;
  border-collapse: collapse;
  font-family: Arial, sans-serif;
}

th, td {
  border: 2px solid black;
  padding: 10px;
  text-align: left;
}

th {
  background-color: #4CAF50;
  color: white;
  font-weight: bold;
}

tr:nth-child(even) {
  background-color: #f2f2f2;
}

tr:hover {
  background-color:red;
}

caption {
  caption-side: top;
  font-size: 20px;
  font-weight:bolder;
  margin-bottom: 10px;
}
</style>
</head>
<body>
    <h1>Tables in html</h1>
    <table>
        <!-- head of the table -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll</th>
                <th>Salary</th>
            </tr>
        </thead>
        <!-- body of the table -->
         <tbody>
            <tr>
                <td>Deep</td>
                <td>Software Developer</td>
                <td>$700</td>
            </tr>
            <tr>
                <td>Rohan</td>
                <td>Software trainee</td>
                <td>$800</td>
            </tr>
            <tr>
                <td>Shivam</td>
                <td>ML engineer</td>
                <td>$100</td>
            </tr>
            <tr>
                <td>Renuka</td>
                <td>ai engineer</td>
                <td>$1000</td>
            </tr>
            <tr>
                <td>Thanks</td>
                <td colspan="2">you</td>
            </tr>
         </tbody>
    </table>
</body>
</html>
